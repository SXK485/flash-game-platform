<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flash游戏">
    <title data-i18n="analytics.title">监控面板</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/i18n.js?v=16"></script>
    <style>
        .analytics-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card .change {
            font-size: 13px;
            margin-top: 8px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .change.positive {
            color: #10b981;
        }

        .change.negative {
            color: #ef4444;
        }

        .section {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filters select,
        .filters input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .game-stats-table {
            width: 100%;
            border-collapse: collapse;
        }

        .game-stats-table th,
        .game-stats-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .game-stats-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
        }

        .game-stats-table tr:hover {
            background: #f8f9fa;
        }

        .access-logs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .access-logs-table th,
        .access-logs-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .access-logs-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            position: sticky;
            top: 0;
        }

        .access-logs-table tr:hover {
            background: #f8f9fa;
        }

        .action-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .action-badge.view {
            background: #dbeafe;
            color: #1e40af;
        }

        .action-badge.play {
            background: #dcfce7;
            color: #166534;
        }

        .action-badge.download {
            background: #fef3c7;
            color: #92400e;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: #f8f9fa;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .chart-container {
            height: 300px;
            margin-top: 20px;
        }

        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 监控面板移动端修正 */
        @media (max-width: 768px) {
            .analytics-container {
                padding: 12px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin-bottom: 16px;
            }

            .stat-card {
                padding: 14px 10px;
            }

            .stat-card h3 {
                font-size: 12px;
                margin-bottom: 6px;
            }

            .stat-card .value {
                font-size: 22px;
            }

            .section {
                padding: 14px 10px;
                margin-bottom: 16px;
            }

            .filters {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
            }

            .filters select,
            .filters input {
                flex: 1 1 calc(50% - 8px);
                min-width: 130px;
                width: auto;
                box-sizing: border-box;
            }

            .filters button {
                flex: 1 1 calc(50% - 8px);
                min-height: 44px;
            }

            .table-scroll {
                overflow: visible;
            }

            /* 宽表格在手机上改成卡片式布局，不再左右滑动 */
            .responsive-card-table,
            .responsive-card-table tbody,
            .responsive-card-table tr,
            .responsive-card-table td {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }

            .responsive-card-table {
                min-width: 0;
            }

            .responsive-card-table thead {
                display: none;
            }

            .responsive-card-table tr {
                background: #f8f9fa;
                border: 1px solid #eef0f3;
                border-radius: 12px;
                padding: 10px 12px;
                margin-bottom: 10px;
            }

            .responsive-card-table tr:hover {
                background: #f3f5f8;
            }

            .responsive-card-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 7px 0;
                border-bottom: 1px dashed #e5e7eb;
                text-align: right;
            }

            .responsive-card-table td:last-child {
                border-bottom: none;
            }

            .responsive-card-table td::before {
                content: attr(data-label);
                flex: 0 0 auto;
                color: #888;
                font-size: 12px;
                text-align: left;
            }

            .pagination {
                flex-wrap: wrap;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
                gap: 6px;
            }

            .header-actions select,
            .header-actions button {
                flex: 0 1 auto;
                min-width: 0;
                width: auto;
                margin-right: 0 !important;
                box-sizing: border-box;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                gap: 8px;
            }

            .stat-card .value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 data-i18n="analytics.title" onclick="window.location.href='/'" style="cursor: pointer;" title="返回首页">📊 监控面板</h1>
            <div class="header-actions">
                <select id="languageSelect" style="padding: 10px; border-radius: 6px; border: 1px solid #ddd; margin-right: 10px; cursor: pointer;">
                    <option value="zh-CN">中文</option>
                    <option value="en">English</option>
                </select>
                <button onclick="window.location.href='/'" class="btn-secondary" data-i18n="nav.home">返回首页</button>
                <button onclick="logout()" class="btn-secondary" data-i18n="nav.logout">退出登录</button>
            </div>
        </div>
    </header>

    <main class="analytics-container">
        <!-- 总体统计 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 data-i18n="analytics.totalViews">总访问量</h3>
                <div class="value" id="totalViews">-</div>
                <div class="change" id="viewsChange">-</div>
            </div>
            <div class="stat-card">
                <h3 data-i18n="analytics.totalPlays">总播放量</h3>
                <div class="value" id="totalPlays">-</div>
                <div class="change" id="playsChange">-</div>
            </div>
            <div class="stat-card">
                <h3 data-i18n="analytics.totalDownloads">总下载量</h3>
                <div class="value" id="totalDownloads">-</div>
                <div class="change" id="downloadsChange">-</div>
            </div>
            <div class="stat-card">
                <h3 data-i18n="analytics.todayActive">今日活跃</h3>
                <div class="value" id="todayActive">-</div>
                <div class="change" id="activeChange">-</div>
            </div>
        </div>

        <!-- 游戏统计 -->
        <div class="section">
            <h2 data-i18n="analytics.gameStats">游戏统计</h2>
            <div class="filters">
                <select id="statsTimeRange">
                    <option value="today" data-i18n="analytics.timeRange.today">今天</option>
                    <option value="7days" selected data-i18n="analytics.timeRange.7days">最近 7 天</option>
                    <option value="30days" data-i18n="analytics.timeRange.30days">最近 30 天</option>
                    <option value="all" data-i18n="analytics.timeRange.all">全部时间</option>
                </select>
                <select id="statsSortBy">
                    <option value="views" data-i18n="analytics.sortBy.views">按访问量</option>
                    <option value="plays" data-i18n="analytics.sortBy.plays">按播放量</option>
                    <option value="downloads" data-i18n="analytics.sortBy.downloads">按下载量</option>
                </select>
            </div>
            <div id="gameStatsLoading" class="loading" data-i18n="analytics.loading">加载中...</div>
            <div class="table-scroll">
                <table class="game-stats-table responsive-card-table" id="gameStatsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th data-i18n="analytics.gameName">游戏名称</th>
                            <th data-i18n="analytics.views">访问量</th>
                            <th data-i18n="analytics.plays">播放量</th>
                            <th data-i18n="analytics.downloads">下载量</th>
                            <th data-i18n="analytics.conversionRate">转化率</th>
                        </tr>
                    </thead>
                    <tbody id="gameStatsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- 访问日志 -->
        <div class="section">
            <h2 data-i18n="analytics.accessLogs">访问日志</h2>
            <div class="filters">
                <select id="logGameFilter">
                    <option value="" data-i18n="analytics.allGames">所有游戏</option>
                </select>
                <select id="logActionFilter">
                    <option value="" data-i18n="analytics.allActions">所有操作</option>
                    <option value="view" data-i18n="analytics.action.view">查看详情</option>
                    <option value="play" data-i18n="analytics.action.play">播放游戏</option>
                    <option value="download" data-i18n="analytics.action.download">下载游戏</option>
                </select>
                <input type="date" id="logDateFilter">
                <button onclick="loadAccessLogs()" class="btn-primary" data-i18n="analytics.filter">筛选</button>
            </div>
            <div id="accessLogsLoading" class="loading" data-i18n="analytics.loading">加载中...</div>
            <div class="table-scroll">
                <table class="access-logs-table responsive-card-table" id="accessLogsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th data-i18n="analytics.time">时间</th>
                            <th data-i18n="analytics.game">游戏</th>
                            <th data-i18n="analytics.action">操作</th>
                            <th data-i18n="analytics.ip">IP 地址</th>
                            <th data-i18n="analytics.country">国家/地区</th>
                            <th data-i18n="analytics.browser">浏览器</th>
                        </tr>
                    </thead>
                    <tbody id="accessLogsBody"></tbody>
                </table>
            </div>
            <div class="pagination" id="logsPagination"></div>
        </div>
    </main>

    <script>
        let adminToken = localStorage.getItem('adminToken');
        let currentPage = 1;
        const pageSize = 50;
        let allGames = [];

        // 初始化语言
        document.addEventListener('DOMContentLoaded', () => {
            const languageSelect = document.getElementById('languageSelect');
            if (languageSelect) {
                languageSelect.value = i18n.getLanguage();
                languageSelect.addEventListener('change', (e) => {
                    i18n.setLanguage(e.target.value);
                    i18n.translatePage();
                    // 重新加载数据以更新动态内容
                    loadOverallStats();
                    loadGameStats();
                    loadAccessLogs();
                });
            }
            i18n.translatePage();
        });

        // 检查权限
        async function checkPermission() {
            if (!adminToken) {
                alert(i18n.t('admin.needPermission'));
                window.location.href = '/';
                return false;
            }

            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (!response.ok) {
                    alert(i18n.t('admin.loginExpired'));
                    localStorage.removeItem('adminToken');
                    window.location.href = '/';
                    return false;
                }

                const user = await response.json();
                if (user.role !== 'super_admin') {
                    alert(i18n.t('admin.needSuperAdmin'));
                    window.location.href = '/';
                    return false;
                }

                return true;
            } catch (error) {
                console.error('权限检查失败:', error);
                alert(i18n.t('admin.permissionCheckFailed'));
                window.location.href = '/';
                return false;
            }
        }

        // 加载总体统计
        async function loadOverallStats() {
            try {
                const response = await fetch('/api/analytics/overview', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('totalViews').textContent = stats.todayViews.toLocaleString();
                    document.getElementById('totalPlays').textContent = stats.todayPlays.toLocaleString();
                    document.getElementById('totalDownloads').textContent = stats.todayDownloads.toLocaleString();
                    document.getElementById('todayActive').textContent = stats.todayActive.toLocaleString();

                    // 大数字显示“今日”，下面显示“累计 / 昨日 / 较昨日”
                    updateStatDetail('viewsChange', stats.todayViews, stats.yesterdayViews, stats.totalViews);
                    updateStatDetail('playsChange', stats.todayPlays, stats.yesterdayPlays, stats.totalPlays);
                    updateStatDetail('downloadsChange', stats.todayDownloads, stats.yesterdayDownloads, stats.totalDownloads);
                    updateStatDetail('activeChange', stats.todayActive, stats.yesterdayActive, stats.totalViews + stats.totalPlays + stats.totalDownloads);
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        function updateStatDetail(elementId, today, yesterday, total) {
            const element = document.getElementById(elementId);
            const diff = today - yesterday;
            const totalLine = `${i18n.t('analytics.totalLabel')} ${total.toLocaleString()}`;

            let compareLine;
            if (yesterday > 0) {
                const percent = Math.round((diff / yesterday) * 100);
                const sign = diff >= 0 ? '+' : '';
                compareLine = `${i18n.t('analytics.yesterday')} ${yesterday.toLocaleString()} · ${i18n.t('analytics.compared')} ${sign}${diff.toLocaleString()} (${sign}${percent}%)`;
            } else if (today > 0) {
                compareLine = `${i18n.t('analytics.yesterday')} 0 · ${i18n.t('analytics.todayNew')} +${today.toLocaleString()}`;
            } else {
                compareLine = `${i18n.t('analytics.yesterday')} 0`;
            }

            element.textContent = `${totalLine}\n${compareLine}`;
            element.className = diff > 0 ? 'change positive' : diff < 0 ? 'change negative' : 'change';
        }

        // 加载游戏统计
        async function loadGameStats() {
            const timeRange = document.getElementById('statsTimeRange').value;
            const sortBy = document.getElementById('statsSortBy').value;

            document.getElementById('gameStatsLoading').style.display = 'block';
            document.getElementById('gameStatsTable').style.display = 'none';

            try {
                const response = await fetch(`/api/analytics/games?timeRange=${timeRange}&sortBy=${sortBy}`, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (response.ok) {
                    const games = await response.json();
                    const tbody = document.getElementById('gameStatsBody');
                    tbody.innerHTML = '';

                    games.forEach(game => {
                        const conversionRate = game.views > 0 ? ((game.plays / game.views) * 100).toFixed(1) : 0;
                        const row = `
                            <tr>
                                <td data-label="${escapeHtml(i18n.t('analytics.gameName'))}"><strong>${escapeHtml(game.title)}</strong></td>
                                <td data-label="${escapeHtml(i18n.t('analytics.views'))}">${game.views.toLocaleString()}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.plays'))}">${game.plays.toLocaleString()}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.downloads'))}">${game.downloads.toLocaleString()}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.conversionRate'))}">${conversionRate}%</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });

                    document.getElementById('gameStatsLoading').style.display = 'none';
                    document.getElementById('gameStatsTable').style.display = '';
                }
            } catch (error) {
                console.error('加载游戏统计失败:', error);
                document.getElementById('gameStatsLoading').textContent = i18n.t('analytics.loadFailed');
            }
        }

        // 加载访问日志
        async function loadAccessLogs(page = 1) {
            currentPage = page;
            const gameId = document.getElementById('logGameFilter').value;
            const action = document.getElementById('logActionFilter').value;
            const date = document.getElementById('logDateFilter').value;

            document.getElementById('accessLogsLoading').style.display = 'block';
            document.getElementById('accessLogsTable').style.display = 'none';

            try {
                let url = `/api/analytics/logs?page=${page}&pageSize=${pageSize}`;
                if (gameId) url += `&gameId=${gameId}`;
                if (action) url += `&action=${action}`;
                if (date) url += `&date=${date}`;

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const tbody = document.getElementById('accessLogsBody');
                    tbody.innerHTML = '';

                    data.logs.forEach(log => {
                        const actionBadge = `<span class="action-badge ${log.action}">${getActionText(log.action)}</span>`;
                        const row = `
                            <tr>
                                <td data-label="${escapeHtml(i18n.t('analytics.time'))}">${formatDateTime(log.created_date)}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.game'))}">${escapeHtml(log.game_title)}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.action'))}">${actionBadge}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.ip'))}">${log.user_ip || '-'}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.country'))}">${log.country || '-'}</td>
                                <td data-label="${escapeHtml(i18n.t('analytics.browser'))}">${getBrowserName(log.user_agent)}</td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });

                    document.getElementById('accessLogsLoading').style.display = 'none';
                    document.getElementById('accessLogsTable').style.display = '';

                    // 更新分页
                    updatePagination(data.total, page);
                }
            } catch (error) {
                console.error('加载访问日志失败:', error);
                document.getElementById('accessLogsLoading').textContent = i18n.t('analytics.loadFailed');
            }
        }

        function updatePagination(total, currentPage) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('logsPagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // 上一页
            const prevBtn = document.createElement('button');
            prevBtn.textContent = i18n.t('analytics.prevPage');
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => loadAccessLogs(currentPage - 1);
            pagination.appendChild(prevBtn);

            // 页码
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                pageBtn.className = i === currentPage ? 'active' : '';
                pageBtn.onclick = () => loadAccessLogs(i);
                pagination.appendChild(pageBtn);
            }

            // 下一页
            const nextBtn = document.createElement('button');
            nextBtn.textContent = i18n.t('analytics.nextPage');
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => loadAccessLogs(currentPage + 1);
            pagination.appendChild(nextBtn);
        }

        // 加载游戏列表（用于筛选）
        async function loadGamesList() {
            try {
                const response = await fetch('/api/games');
                if (response.ok) {
                    allGames = await response.json();
                    const select = document.getElementById('logGameFilter');
                    allGames.forEach(game => {
                        const option = document.createElement('option');
                        option.value = game.id;
                        option.textContent = game.title;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('加载游戏列表失败:', error);
            }
        }

        function getActionText(action) {
            return i18n.t(`analytics.action.${action}`) || action;
        }

        function getBrowserName(userAgent) {
            if (!userAgent) return '-';
            if (userAgent.includes('Chrome')) return 'Chrome';
            if (userAgent.includes('Firefox')) return 'Firefox';
            if (userAgent.includes('Safari')) return 'Safari';
            if (userAgent.includes('Edge')) return 'Edge';
            return 'Other';
        }

        function formatDateTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString(i18n.getLanguage(), {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            if (confirm(i18n.t('logout.confirm'))) {
                localStorage.removeItem('adminToken');
                window.location.href = '/';
            }
        }

        // 初始化
        async function init() {
            if (await checkPermission()) {
                loadOverallStats();
                loadGameStats();
                loadGamesList();
                loadAccessLogs();

                // 设置今天的日期为默认值
                document.getElementById('logDateFilter').valueAsDate = new Date();

                // 监听筛选变化
                document.getElementById('statsTimeRange').addEventListener('change', loadGameStats);
                document.getElementById('statsSortBy').addEventListener('change', loadGameStats);
            }
        }

        init();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW 注册失败:', err));
            });
        }
    </script>
</body>
