<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flash游戏">
    
    <!-- SEO Meta Tags (will be updated dynamically by JavaScript) -->
    <title>游戏详情 - Flash 游戏平台</title>
    <meta name="description" content="在线播放 Flash 游戏，使用 Ruffle 播放器，支持评论、下载。">
    <meta name="robots" content="index, follow">
    
    <!-- Canonical URL (will be updated dynamically) -->
    <link rel="canonical" href="https://flash.flowerspine.xyz/game.html">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="fe02d8ac46013a2b">
    
    <link rel="stylesheet" href="/style.css">
    <script src="/i18n.js?v=16"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="game-page">
    <header>
        <div class="container">
            <h1 data-i18n="app.title" onclick="window.location.href='/'" style="cursor: pointer;" title="返回首页">🎮 Flash 游戏平台</h1>
            <div class="header-actions">
                <select id="languageSelect" style="padding: 10px; border-radius: 6px; border: 1px solid #ddd; margin-right: 10px; cursor: pointer;">
                    <option value="zh-CN">中文</option>
                    <option value="en">English</option>
                </select>
                <button onclick="window.location.href='/'" class="btn-secondary" data-i18n="nav.home">返回首页</button>
                <button id="logoutBtn" class="btn-secondary" style="display: none;" onclick="logout()" data-i18n="nav.logout">退出登录</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="gameDetail" class="game-detail">
            <div id="loading">加载中...</div>
        </div>

        <!-- 评论区 -->
        <div class="comments-section">
            <h2 data-i18n="comments.title">评论区</h2>
            <div class="comment-form">
                <div id="replyInfo" class="reply-info" style="display: none;">
                    <span id="replyText"></span>
                    <button onclick="cancelReply()" class="btn-cancel-reply" data-i18n="comments.cancelReply">取消回复</button>
                </div>
                <textarea id="commentInput" data-i18n-placeholder="comments.placeholder" placeholder="写下你的评论...（最多1000字）" maxlength="1000"></textarea>
                <button id="submitComment" class="btn-primary" data-i18n="comments.submit">发表评论</button>
            </div>
            <div id="commentsList" class="comments-list"></div>
        </div>
    </main>

    <script>
        let isAdmin = false;
        let isSuperAdmin = false;
        let currentUser = null;
        let adminToken = localStorage.getItem('adminToken');
        let currentReplyTo = null; // 当前回复的评论 ID
        let currentQuotedText = ''; // 当前引用的文字

        // 获取匿名设备 ID（与首页 app.js 使用同一个 localStorage key）
        function getVisitorDeviceId() {
            let deviceId = localStorage.getItem('flashVisitorId');
            if (!deviceId) {
                if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                    deviceId = window.crypto.randomUUID();
                } else {
                    deviceId = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
                }
                localStorage.setItem('flashVisitorId', deviceId);
            }
            return deviceId;
        }

        // 加载当前游戏的收藏状态
        async function loadFavoriteState(gameId) {
            try {
                const response = await fetch(`/api/favorites?deviceId=${encodeURIComponent(getVisitorDeviceId())}`);
                if (!response.ok) return;

                const ids = await response.json();
                updateDetailFavoriteButton(gameId, ids.map(id => Number(id)).includes(Number(gameId)));
            } catch (error) {
                console.error('加载收藏状态失败:', error);
            }
        }

        // 详情页切换收藏
        async function toggleFavoriteFromDetail(gameId) {
            const deviceId = getVisitorDeviceId();
            try {
                const response = await fetch('/api/favorites', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ deviceId, gameId })
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const result = await response.json();
                updateDetailFavoriteButton(gameId, result.action === 'added');
            } catch (error) {
                console.error('收藏操作失败:', error);
                alert(i18n.t('favorites.toggleFailed'));
            }
        }

        function updateDetailFavoriteButton(gameId, isFavorite) {
            const btn = document.getElementById('favoriteGameBtn');
            if (!btn) return;
            btn.classList.toggle('active', isFavorite);
            btn.innerHTML = isFavorite ? '❤️ ' + i18n.t('favorites.added') : '🤍 ' + i18n.t('favorites.add');
        }
        
        // 检查登录状态
        async function checkLoginStatus() {
            console.log('[DEBUG] 开始检查登录状态, adminToken:', adminToken ? '存在' : '不存在');
            
            if (adminToken) {
                try {
                    const response = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${adminToken}`
                        }
                    });
                    
                    console.log('[DEBUG] /api/auth/me 响应状态:', response.status);
                    
                    if (response.ok) {
                        currentUser = await response.json();
                        isAdmin = true;
                        isSuperAdmin = currentUser.role === 'super_admin';
                        document.getElementById('logoutBtn').style.display = 'inline-block';
                        
                        console.log('[DEBUG] 登录状态确认 - isAdmin:', isAdmin, 'isSuperAdmin:', isSuperAdmin, 'user:', currentUser);
                        return true;
                    } else {
                        console.log('[DEBUG] Token 无效，清除登录状态');
                        // Token 无效，清除
                        localStorage.removeItem('adminToken');
                        adminToken = null;
                    }
                } catch (error) {
                    console.error('[DEBUG] 检查登录状态失败:', error);
                }
            }
            
            console.log('[DEBUG] 未登录状态');
            return false;
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('adminToken');
                window.location.reload();
            }
        }

        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id');

        // 初始化语言
        const languageSelect = document.getElementById('languageSelect');
        if (languageSelect) {
            languageSelect.value = i18n.getLanguage();
            languageSelect.addEventListener('change', (e) => {
                i18n.setLanguage(e.target.value);
                i18n.translatePage();
                // 重新加载游戏详情
                if (gameId) {
                    loadGameDetail(gameId);
                    loadComments(gameId);
                }
            });
        }
        i18n.translatePage();

        if (!gameId) {
            document.getElementById('loading').textContent = i18n.t('app.error') + '：缺少游戏 ID';
        } else {
            // 先检查登录状态，再加载游戏
            checkLoginStatus().then(() => {
                loadGameDetail(gameId);
                loadComments(gameId);
            });
        }

        // 页面显示时重新检查状态（处理浏览器返回）
        let pageLoadCount = 0;
        window.addEventListener('pageshow', (event) => {
            pageLoadCount++;
            console.log('[DEBUG] game.html pageshow 事件触发, persisted:', event.persisted, 'pageLoadCount:', pageLoadCount);
            
            // 如果不是第一次触发 pageshow，说明是浏览器返回
            if (pageLoadCount > 1) {
                console.log('[DEBUG] 检测到浏览器返回，重新加载游戏详情');
                checkLoginStatus().then(() => {
                    console.log('[DEBUG] 登录状态检查完成，重新加载游戏详情');
                    loadGameDetail(gameId);
                });
            }
        });

        async function loadGameDetail(id) {
            try {
                console.log('[DEBUG] 加载游戏详情, ID:', id, 'isAdmin:', isAdmin, 'isSuperAdmin:', isSuperAdmin);
                
                const response = await fetch(`/api/games/${id}`);
                const game = await response.json();

                document.title = game.title + ' - Flash 游戏平台';

                // 记录访问日志
                logAnalytics(id, 'view');

                const adminButtons = isAdmin ? `
                    <button onclick="window.location.href='/?edit=${game.id}'" class="btn-secondary">
                        ${i18n.t('game.editGame')}
                    </button>
                    <button onclick="deleteGameFromDetail(${game.id})" class="btn-danger">
                        ${i18n.t('game.deleteGame')}
                    </button>
                ` : '';
                
                console.log('[DEBUG] 管理按钮HTML:', adminButtons);

                const detailHTML = `
                    <div class="game-header">
                        ${game.thumbnail_url ? `<img src="${game.thumbnail_url}" alt="${game.title}" class="game-detail-thumbnail">` : ''}
                        <div class="game-header-info">
                            <h1>${escapeHtml(game.title)}</h1>
                            ${game.tags && game.tags.length > 0 ? `
                                <div class="game-tags">
                                    ${game.tags.map(tag => `<span class="tag">${escapeHtml(tag.name)}</span>`).join('')}
                                </div>
                            ` : ''}
                            <p class="game-description">${escapeHtml(game.description || i18n.t('game.noDescription'))}</p>
                            <div class="game-meta">
                                <span>🎮 ${game.play_count} ${i18n.t('games.plays')}</span>
                                <span>📦 ${formatFileSize(game.file_size)}</span>
                                <span>📅 ${new Date(game.upload_date).toLocaleDateString(i18n.getLanguage())}</span>
                            </div>
                            <div style="margin-top: 16px;">
                                <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #333;">
                                    🎨 ${i18n.t('game.renderer')}
                                </label>
                                <select id="rendererSelect" style="width: 100%; max-width: 300px; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; background: white; cursor: pointer;">
                                    <option value="auto">${i18n.t('game.renderer.auto')}</option>
                                    <option value="webgpu">WebGPU</option>
                                    <option value="wgpu-webgl">wgpu (via WebGL)</option>
                                    <option value="webgl">WebGL</option>
                                    <option value="canvas">Canvas2D</option>
                                </select>
                                <p style="margin: 8px 0 0 0; font-size: 13px; color: #666;">
                                    💡 ${i18n.t('game.renderer.tip')}
                                </p>
                            </div>
                            <div class="game-actions" style="display: flex; gap: 12px; margin-top: 20px;">
                                <button id="favoriteGameBtn" class="btn-secondary" onclick="toggleFavoriteFromDetail(${game.id})">
                                    🤍 ${i18n.t('favorites.add')}
                                </button>
                                <button onclick="playGameAndLog(${game.id})" class="btn-primary">
                                    ${i18n.t('game.startGame')}
                                </button>
                                <button onclick="downloadGame(${game.id}, '${escapeHtml(game.title)}')" class="btn-secondary">
                                    📥 ${i18n.t('game.downloadGame')}
                                </button>
                                ${adminButtons}
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('gameDetail').innerHTML = detailHTML;

                // 加载收藏状态
                loadFavoriteState(id);
            } catch (error) {
                console.error('[DEBUG] 加载游戏失败:', error);
                document.getElementById('loading').textContent = '加载失败，请返回重试';
            }
        }

        // 记录分析日志
        async function logAnalytics(gameId, action) {
            try {
                const response = await fetch('/api/analytics/log', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ gameId, action })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    console.error('记录分析日志失败:', error);
                } else {
                    console.log(`[Analytics] 记录成功: ${action} - 游戏 ${gameId}`);
                }
            } catch (error) {
                console.error('记录分析日志失败:', error);
            }
        }

        // 播放游戏并记录日志
        function playGameAndLog(gameId) {
            logAnalytics(gameId, 'play');
            const renderer = document.getElementById('rendererSelect').value;
            window.open(`/play.html?id=${gameId}&renderer=${renderer}`, '_blank');
        }

        async function loadComments(gameId) {
            try {
                const response = await fetch(`/api/games/${gameId}/comments`);
                const comments = await response.json();

                const commentsList = document.getElementById('commentsList');
                
                if (comments.length === 0) {
                    commentsList.innerHTML = `<p class="no-comments">${i18n.t('comments.noComments')}</p>`;
                    return;
                }

                // 检查用户已点赞的评论
                const likedComments = JSON.parse(localStorage.getItem('likedComments') || '[]');

                commentsList.innerHTML = comments.map(comment => {
                    const isLiked = likedComments.includes(comment.id);
                    const likeClass = isLiked ? 'liked' : '';
                    
                    return `
                        <div class="comment" id="comment-${comment.id}">
                            <div class="comment-header">
                                <span class="comment-username">${escapeHtml(comment.username)}</span>
                                <span class="comment-date">${formatDate(comment.created_date)}</span>
                                <button class="btn-like-comment ${likeClass}" onclick="toggleLike(${comment.id})" data-comment-id="${comment.id}">
                                    <span class="like-icon">${isLiked ? '❤️' : '🤍'}</span>
                                    <span class="like-count">${comment.likes_count || 0}</span>
                                </button>
                                <button class="btn-reply-comment" onclick="replyToComment(${comment.id}, '${escapeHtml(comment.username)}', \`${escapeHtml(comment.content).replace(/`/g, '\\`')}\`)">
                                    ${i18n.t('comments.reply')}
                                </button>
                                ${isAdmin ? `
                                    <button class="btn-delete-comment" onclick="deleteComment(${comment.id})">${i18n.t('comments.delete')}</button>
                                ` : ''}
                            </div>
                            ${comment.quoted_text ? `
                                <div class="comment-quote">
                                    ${escapeHtml(comment.quoted_text)}
                                </div>
                            ` : ''}
                            <div class="comment-content">${escapeHtml(comment.content)}</div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('加载评论失败:', error);
            }
        }

        // 点赞/取消点赞
        async function toggleLike(commentId) {
            try {
                const response = await fetch(`/api/comments/${commentId}/like`, {
                    method: 'POST'
                });

                if (response.ok) {
                    const result = await response.json();
                    const likedComments = JSON.parse(localStorage.getItem('likedComments') || '[]');
                    
                    if (result.action === 'liked') {
                        // 添加到已点赞列表
                        likedComments.push(commentId);
                        localStorage.setItem('likedComments', JSON.stringify(likedComments));
                    } else {
                        // 从已点赞列表移除
                        const index = likedComments.indexOf(commentId);
                        if (index > -1) {
                            likedComments.splice(index, 1);
                            localStorage.setItem('likedComments', JSON.stringify(likedComments));
                        }
                    }
                    
                    // 重新加载评论
                    loadComments(gameId);
                } else {
                    alert(i18n.t('comments.postFailed'));
                }
            } catch (error) {
                console.error('点赞失败:', error);
                alert(i18n.t('comments.postFailed'));
            }
        }

        // 回复评论
        function replyToComment(commentId, username, content) {
            currentReplyTo = commentId;
            
            // 截取前50个字符作为引用
            const quotedContent = content.length > 50 ? content.substring(0, 50) + '...' : content;
            currentQuotedText = `@${username} 说：\n> ${quotedContent}`;
            
            // 显示回复信息
            document.getElementById('replyInfo').style.display = 'flex';
            document.getElementById('replyText').textContent = `${i18n.t('comments.replyTo')} ${username}`;
            
            // 聚焦到输入框
            document.getElementById('commentInput').focus();
            
            // 滚动到评论框
            document.querySelector('.comment-form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 取消回复
        function cancelReply() {
            currentReplyTo = null;
            currentQuotedText = '';
            document.getElementById('replyInfo').style.display = 'none';
            document.getElementById('commentInput').value = '';
        }

        document.getElementById('submitComment').addEventListener('click', async () => {
            const content = document.getElementById('commentInput').value.trim();
            
            if (!content) {
                alert(i18n.t('comments.inputRequired'));
                return;
            }

            try {
                const response = await fetch(`/api/games/${gameId}/comments`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        content,
                        replyTo: currentReplyTo,
                        quotedText: currentQuotedText
                    })
                });

                if (response.ok) {
                    document.getElementById('commentInput').value = '';
                    cancelReply();
                    loadComments(gameId);
                    alert(i18n.t('comments.postSuccess'));
                } else {
                    const error = await response.json();
                    alert(i18n.t('comments.postFailed') + ': ' + error.error);
                }
            } catch (error) {
                console.error('评论失败:', error);
                alert(i18n.t('comments.postFailed'));
            }
        });

        async function deleteComment(commentId) {
            if (!confirm(i18n.t('comments.deleteConfirm'))) {
                return;
            }

            try {
                const response = await fetch(`/api/comments/${commentId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (response.ok) {
                    loadComments(gameId);
                    alert(i18n.t('comments.deleteSuccess'));
                } else {
                    alert(i18n.t('comments.deleteFailed'));
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert(i18n.t('comments.deleteFailed'));
            }
        }

        async function deleteGameFromDetail(gameId) {
            if (!confirm(i18n.t('game.deleteConfirm'))) {
                return;
            }

            try {
                const response = await fetch(`/api/games/${gameId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${adminToken}`
                    }
                });

                if (response.ok) {
                    alert(i18n.t('game.deleteSuccess'));
                    window.location.href = '/';
                } else {
                    alert(i18n.t('game.deleteFailed'));
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert(i18n.t('game.deleteFailed'));
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (!bytes) return i18n.t('fileSize.unknown');
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return i18n.t('time.justNow');
            if (minutes < 60) return `${minutes} ${i18n.t('time.minutesAgo')}`;
            if (hours < 24) return `${hours} ${i18n.t('time.hoursAgo')}`;
            if (days < 7) return `${days} ${i18n.t('time.daysAgo')}`;
            return date.toLocaleDateString(i18n.getLanguage());
        }

        // 下载游戏
        async function downloadGame(gameId, gameTitle) {
            const btn = event.target;
            const originalText = btn.innerHTML;
            
            try {
                // 记录下载日志
                logAnalytics(gameId, 'download');

                btn.disabled = true;
                btn.innerHTML = `⏳ ${i18n.t('download.preparing')}`;
                
                // 获取游戏文件列表
                const response = await fetch(`/api/games/${gameId}/files`);
                if (!response.ok) {
                    // 检查是否是下载限制错误
                    if (response.status === 403) {
                        const errorData = await response.json();
                        if (errorData.restricted) {
                            throw new Error(errorData.error || i18n.t('download.restricted'));
                        }
                    }
                    throw new Error(i18n.t('download.getFilesFailed'));
                }
                
                const files = await response.json();
                console.log('游戏文件列表:', files);
                
                if (!files || files.length === 0) {
                    throw new Error(i18n.t('download.noFiles'));
                }
                
                btn.innerHTML = `📦 ${i18n.t('download.packaging')}`;
                
                // 创建 ZIP
                const zip = new JSZip();
                let downloadedCount = 0;
                
                // 下载所有文件并添加到 ZIP
                for (const file of files) {
                    try {
                        btn.innerHTML = `📥 ${i18n.t('download.downloading')} (${downloadedCount + 1}/${files.length})...`;
                        
                        const fileResponse = await fetch(`/files/${file.path}`);
                        if (!fileResponse.ok) {
                            console.warn(`文件下载失败: ${file.path}`);
                            continue;
                        }
                        
                        const blob = await fileResponse.blob();
                        zip.file(file.name, blob);
                        downloadedCount++;
                        
                        console.log(`已下载: ${file.name} (${downloadedCount}/${files.length})`);
                    } catch (error) {
                        console.error(`下载文件失败: ${file.path}`, error);
                    }
                }
                
                if (downloadedCount === 0) {
                    throw new Error(i18n.t('download.allFailed'));
                }
                
                btn.innerHTML = `🗜️ ${i18n.t('download.compressing')}`;
                
                // 生成 ZIP 文件
                const zipBlob = await zip.generateAsync({ 
                    type: 'blob',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                });
                
                // 触发下载
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${gameTitle}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                btn.innerHTML = `✅ ${i18n.t('download.complete')}`;
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }, 2000);
                
            } catch (error) {
                console.error('下载失败:', error);
                alert(i18n.t('download.failed') + ': ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW 注册失败:', err));
            });
        }
    </script>
</body>
</html>
