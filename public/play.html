<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="apple-mobile-web-app-title" content="Flash游戏">
    
    <!-- SEO Meta Tags -->
    <title>播放游戏 - Flash 游戏平台</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="fe02d8ac46013a2b">
    
    <script src="/i18n.js?v=16"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        #back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            z-index: 10000;
            transition: all 0.3s;
        }
        #back-btn:hover {
            background: white;
            transform: translateY(-2px);
        }
        /* 移动端优化 */
        @media (max-width: 768px) {
            #back-btn {
                padding: 10px 16px;
                font-size: 14px;
                top: 10px;
                left: 10px;
            }
        }
        #player-container {
            overflow-y: hidden;
            flex-grow: 1;
        }
        #player-container > * {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <button id="back-btn" onclick="window.close()" data-i18n="app.back">← 返回</button>
    <div id="player-container">
        <div id="loading" data-i18n="app.loading">加载中...</div>
    </div>
    <script>
        // 初始化语言
        i18n.translatePage();
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get('id');
        const renderer = params.get('renderer') || 'auto'; // 获取渲染器参数，默认 auto
        let currentGame = null;

        if (!gameId) {
            document.getElementById('loading').textContent = '错误：缺少游戏 ID';
        } else {
            loadGame(gameId);
        }

        // 获取匿名设备 ID（与首页收藏/最近游玩使用同一个 key）
        function getVisitorDeviceId() {
            let deviceId = localStorage.getItem('flashVisitorId');
            if (!deviceId) {
                if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                    deviceId = window.crypto.randomUUID();
                } else {
                    deviceId = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
                }
                localStorage.setItem('flashVisitorId', deviceId);
            }
            return deviceId;
        }

        // 记录最近游玩
        async function recordPlayHistory(gameId) {
            try {
                await fetch('/api/play-history', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        deviceId: getVisitorDeviceId(),
                        gameId: gameId
                    })
                });
            } catch (error) {
                console.error('记录最近游玩失败:', error);
            }
        }

        async function loadGame(id) {
            try {
                const response = await fetch(`/api/games/${id}`);
                const game = await response.json();
                currentGame = game;

                // 记录最近游玩（失败不影响播放）
                recordPlayHistory(game.id);

                // 如果有存档文件，先加载存档再启动游戏
                if (game.save_file_key && game.save_name) {
                    try {
                        await loadSaveFileBeforeGame(game);
                    } catch (error) {
                        console.error('存档加载失败:', error);
                    }
                }

                // 通过 Workers 代理加载所有文件
                const swfUrl = `/files/${game.folder_name}/${game.swf_filename}`;
                const baseUrl = `/files/${game.folder_name}/`;
                
                window.RufflePlayer = window.RufflePlayer || {};
                
                // 根据渲染器参数配置 Ruffle
                const config = {};
                if (renderer !== 'auto') {
                    config.preferredRenderer = renderer;
                    console.log('[Ruffle] 使用指定渲染器:', renderer);
                } else {
                    console.log('[Ruffle] 使用自动渲染器');
                }
                window.RufflePlayer.config = config;
                
                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                const container = document.getElementById("player-container");
                container.innerHTML = '';
                container.appendChild(player);
                
                player.load({
                    url: swfUrl,
                    base: baseUrl,
                    allowScriptAccess: true,
                    parameters: {},
                    autoplay: "auto",
                    backgroundColor: null,
                    letterbox: "on",
                    forceScale: true,
                    forceAlign: true,
                    unmuteOverlay: "visible",
                    upgradeToHttps: false,
                    logLevel: "warn",
                    allowNetworking: "all",
                    favorFlash: false,
                    warnOnUnsupportedContent: true,
                    quality: "high",
                    scale: "showAll"
                }).catch(err => {
                    console.error('Ruffle 加载失败:', err);
                    container.innerHTML = '<div id="loading">加载失败: ' + err.message + '</div>';
                });
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('loading').textContent = '加载失败，请返回重试';
            }
        }

        // 在游戏启动前加载存档
        async function loadSaveFileBeforeGame(game) {
            const response = await fetch(`/files/${game.save_file_key}`);
            if (!response.ok) {
                throw new Error('存档文件不存在或无法访问');
            }
            
            const arrayBuffer = await response.arrayBuffer();
            const base64 = arrayBufferToBase64(arrayBuffer);
            
            const saveName = game.save_name || 'mu09';
            const saveKey = `${window.location.hostname}//${saveName}`;
            
            localStorage.removeItem(saveKey);
            localStorage.setItem(saveKey, base64);
            
            const verified = localStorage.getItem(saveKey);
            if (!verified || verified !== base64) {
                throw new Error('写入失败');
            }
        }

        // ArrayBuffer 转 Base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }


    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW 注册失败:', err));
            });
        }
    </script>
</body>
</html>
